# Connectivity check: can Ansible reach every server with the SSH key?
#   ansible-playbook ping.yml
- name: Ping all servers
  hosts: all
  gather_facts: true

  tasks:
    - name: Ping
      ansible.builtin.ping:

    - name: Show hostname and IPs
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} | hostname={{ ansible_hostname }}
          | public={{ ansible_host }} | private={{ ansible_default_ipv4.address }}
          | {{ ansible_distribution }} {{ ansible_distribution_version }}
