# Ansible settings. Run every ansible command from infra/ansible/
# so this file (and inventory.ini next to it) is picked up.

[defaults]
inventory           = inventory.ini
remote_user         = ubuntu
private_key_file    = ~/.ssh/lms_key
host_key_checking   = False
# Decrypts group_vars/all/vault.yml without prompting.
vault_password_file = ~/.vault_pass
interpreter_python  = /usr/bin/python3
retry_files_enabled = False

[ssh_connection]
# Faster, and lets `become_user: postgres` work without extra temp-file permissions.
pipelining = True
